<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-label="DhakaPath logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#00b894"/>
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" rx="36" fill="#ffffff"/>
  <g transform="translate(32,32) scale(0.75)">
    <!-- circular route path -->
    <circle cx="128" cy="128" r="96" fill="none" stroke="url(#g)" stroke-width="18" stroke-linecap="round"/>
    <!-- metro/train car -->
    <rect x="88" y="96" width="80" height="56" rx="8" fill="#0f172a"/>
    <rect x="96" y="104" width="64" height="40" rx="6" fill="#ffffff"/>
    <circle cx="104" cy="152" r="6" fill="#0f172a"/>
    <circle cx="152" cy="152" r="6" fill="#0f172a"/>
    <!-- stylized 'D' path marker -->
    <path d="M200 64c-20 0-40 8-56 22" stroke="#0f172a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <text x="40" y="260" font-family="Segoe UI, Roboto, Arial" font-weight="700" font-size="36" fill="#0f172a">DhakaPath</text>
  </g>
</svg>
